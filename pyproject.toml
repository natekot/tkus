[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tkus"
dynamic = ["version"]
description = "Attribute AI agent token usage and cost to individual git commits."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# No runtime dependencies: the hook runs on every commit, so it must not drag
# in an import graph that can break independently of the tool.
dependencies = []

[project.scripts]
tkus = "tkus.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "tkus.__version__" }

[tool.setuptools]
packages = ["tkus", "tkus.providers"]

[tool.setuptools.package-data]
tkus = ["rates.json"]
